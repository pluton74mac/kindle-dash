[project]
name = "kindle-dash-mcp"
version = "0.1.0"
description = "MCP server that turns a jailbroken Kindle into a shared e-ink dashboard for AI agents"
readme = "README.md"
authors = [
    { name = "Pluton Mac" }
]
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]==1.9.4",
    "pillow>=12.3.0",
]

[project.scripts]
kindle-dash-mcp = "kindle_dash_mcp.__main__:main"

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"
